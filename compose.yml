services:
  loki:
    image: grafana/loki:3.5.5
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml
    command: -config.file=/etc/loki/config.yaml

  alloy:
    image: grafana/alloy:latest
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy
      - ../nagomi-core/nagomi-core.log:/var/log/nagomi-core.log:ro
      - ../nagomi-email-parser/nagomi-email-parser.log:/var/log/nagomi-email-parser.log:ro
      - ../nagomi-receipts/nagomi-receipts.log:/var/log/nagomi-receipts.log:ro
      - ../nagomi-gateway/nagomi-gateway.log:/var/log/nagomi-gateway.log:ro
    command: run /etc/alloy/config.alloy --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.3.0-17782621999
    ports:
      - "56000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
    depends_on:
      - loki

volumes:
  grafana-storage:
